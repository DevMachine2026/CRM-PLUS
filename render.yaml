# Blueprint Render — CRM PLUS
# Dashboard → New → Blueprint → conectar repo DevMachine2026/CRM-PLUS
#
# Evolution GO é serviço separado (repo EvolutionAPI/evolution-go, Docker).
# Veja docs/EVOLUTION-GO.md e a seção abaixo no README de deploy.

databases:
  - name: crm-plus-db
    plan: starter
    region: oregon
    databaseName: crmplus
    user: crmplus

services:
  - type: web
    name: crm-plus
    runtime: node
    plan: starter
    region: oregon
    branch: master
    buildCommand: npm install && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: crm-plus-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: AUTH_SECRET
        fromService:
          type: web
          name: crm-plus
          envVarKey: NEXTAUTH_SECRET
      - key: NEXTAUTH_URL
        sync: false
      - key: AI_PROVIDER
        value: gemini
      - key: GOOGLE_AI_API_KEY
        sync: false
      - key: CRON_SECRET
        generateValue: true
      - key: EVOLUTION_API_URL
        sync: false
      - key: EVOLUTION_API_KEY
        sync: false

  - type: cron
    name: crm-follow-up
    runtime: node
    plan: starter
    region: oregon
    schedule: "0 * * * *"
    buildCommand: "true"
    startCommand: >-
      curl -sf -X GET "${NEXTAUTH_URL}/api/ai/follow-up"
      -H "Authorization: Bearer ${CRON_SECRET}"
    envVars:
      - key: NEXTAUTH_URL
        sync: false
      - key: CRON_SECRET
        fromService:
          type: web
          name: crm-plus
          envVarKey: CRON_SECRET

  - type: cron
    name: crm-stalled
    runtime: node
    plan: starter
    region: oregon
    schedule: "0 11 * * *"
    buildCommand: "true"
    startCommand: >-
      curl -sf -X GET "${NEXTAUTH_URL}/api/ai/stalled"
      -H "Authorization: Bearer ${CRON_SECRET}"
    envVars:
      - key: NEXTAUTH_URL
        sync: false
      - key: CRON_SECRET
        fromService:
          type: web
          name: crm-plus
          envVarKey: CRON_SECRET
